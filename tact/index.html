<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f1">
<meta name="apple-mobile-web-app-title" content="Tact">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<title>Tact — 采配の千本ノック</title>
<style>
/* =========================================================================
   デザインの前提 — プロの目/WebデザインUI.md v3.0 の初適用（2026-08-01）
   コンセプト1枚:
   ① 実世界の物に例えると: 監督がダグアウトで手にする、深緑の作戦盤（マグネットボード）
   ② 擬音語: かちり（マグネットを置く音 ＝ 決断の音）
   ③ 形容詞3語: 静か / 即断 / 骨太
   ④ 主役: 盤面。点差の数字を画面で一番大きくする（44px）
   ⑤ やらないこと3つ: グラデを使わない / 常設のカード・行に影を付けない /
      盤面緑・マグネット朱・土（達成時のみ）以外の彩色を足さない
   署名要素: 菱形（ベース）1つだけ。見出しの頭・進捗・選択の印に使う
   分離手段: 面（カード）を主に1段階。罫線は一覧と検討室の区切りのみ。影は浮くもの（モーダル・トースト）だけ
   ========================================================================= */
:root {
  color-scheme: light dark;
  /* 色 — 題材（作戦盤・石灰・土）から。ニュートラルは緑の色相を微量に載せる */
  --paper: #f3f5f1;        /* 地: 石灰がうっすら混ざった白 */
  --card: #fbfcfa;         /* 面: 地との明度差は約2ポイントに留める（線や影で囲まない） */
  --ink: #1e2720;          /* 本文: 緑がかった墨 */
  --ink-soft: #57635a;     /* 補助文字: 地に対して5.5:1 */
  --line: #dde3dc;         /* 飾りの罫線（区切り用） */
  --line-strong: #6f7d72;  /* 対話部品の境界: 地に対して3:1 */
  --seal: #156b3f;         /* 印: 盤面の深緑。面積5%未満の要素にだけ使う */
  --seal-deep: #0f5731;
  --seal-ink: #ffffff;
  --seal-soft: #e4efe6;
  --board: #33493c;        /* 盤面: 面積が大きいので彩度を落とした作戦盤の緑 */
  --board-line: #96a898;   /* 盤面上の枠線 */
  --board-soft: #c6d1c7;   /* 盤面上の補助文字 */
  --board-ink: #f2f5f1;
  --base-on: #e08b5c;      /* 走者マグネットの朱（盤面上） */
  --magnet: #b4470e;       /* 注意・異議・ライブ状態の朱（マグネットの色） */
  --magnet-soft: #f9ece3;
  --safety-bg: #f8f0dc;    /* 安全の箱の琥珀だけ、例外的に別色相 */
  --safety-ink: #8a5e13;
  --clay: #96602f;         /* 土: 達成の瞬間にだけ出る色 */
  --chip: #eaeee8;
  --danger: #b4470e;       /* JSのインラインstyleから参照（= --magnet） */
  --shadow-float: 0 2px 6px rgba(22, 42, 30, .10), 0 14px 32px rgba(22, 42, 30, .16);
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  /* 角丸の階（直書きをやめて階層をトークンに上げる。値は据え置き） */
  --r-mark: 1px;    /* 署名の菱形 */
  --r-chip: 6px;    /* バッジ */
  --r-btn: 8px;     /* ボタン・入力欄・小箱 */
  --r-card: 12px;   /* カード・盤面・箱 */
  --r-modal: 16px;  /* モーダル・シート */
  --r-pill: 9999px; /* ピル */
  /* 余白の階（内側＜外側。§6 internal ≤ external） */
  --sp-1: 6px; --sp-2: 10px; --sp-3: 14px; --sp-4: 16px; --sp-5: 24px; --sp-6: 40px;
}
@media (prefers-color-scheme: dark) {
  :root {
    /* ダークは反転でなく別設計: 影を使わず、面の明度差で階層を作る */
    --paper: #131713;
    --card: #1b211c;
    --ink: #e5e9e3;
    --ink-soft: #a0aca2;
    --line: #2a322b;
    --line-strong: #556357;
    --seal: #5fae83;       /* Lを上げてCを下げる（蛍光化を防ぐ） */
    --seal-deep: #79c29a;
    --seal-ink: #0c2013;
    --seal-soft: #21372a;
    --board: #243129;
    --board-line: #6b7c6d;
    --board-soft: #b9c4ba;
    --board-ink: #e5e9e3;
    --base-on: #e08b5c;
    --magnet: #e08b5c;
    --magnet-soft: #34261b;
    --safety-bg: #332a15;
    --safety-ink: #d9a94e;
    --clay: #c08a4a;
    --chip: #232b24;
    --danger: #e08b5c;
    --shadow-float: 0 0 0 1px rgba(255, 255, 255, .07);
  }
}

/* ---------- 土台と日本語組版 ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; height: 100%; }
body {
  font-family: ui-sans-serif, -apple-system, "Segoe UI",
    "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  background: var(--paper); color: var(--ink);
  font-size: 1rem; line-height: 1.75; letter-spacing: .02em;
  line-break: strict; word-break: normal; overflow-wrap: break-word;
  -webkit-tap-highlight-color: rgba(21, 107, 63, .18);
  /* 画面を3段（アプリバー・巻物・タブバー）に組み、body自体はスクロールさせない。
     iOS Safari は body スクロール中にツールバーを伸縮させ、position:fixed の底が
     追随せず「タブバーが画面の途中に浮く」。スクロールを内側の器に閉じ込めて根治する */
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh; overflow: hidden;
}
/* 画面遷移のたびに先頭へ戻すので、ここは smooth にしない（毎回スルスル動くのは邪魔） */
#scroll { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
::selection { background: var(--seal-soft); color: var(--ink); }
::placeholder { color: var(--ink-soft); opacity: 1; }
input, textarea { caret-color: var(--seal); }
:where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--seal); outline-offset: 2px;
}
:where(input, select, textarea):focus-visible { outline-offset: 0; }
a { color: var(--seal); }

/* ---------- 見出しと文字（サイズは 14 / 16 / 20 / 44 の4段） ---------- */
h2 { font-size: 1.25rem; line-height: 1.45; letter-spacing: .01em; font-feature-settings: "palt" 1; margin: 24px 0 10px; }
h2:first-child { margin-top: 2px; }
h2::before { content: ""; display: inline-block; width: 9px; height: 9px; background: var(--seal);
  border-radius: var(--r-mark); transform: rotate(45deg); margin-right: 10px; vertical-align: .08em; }
h3 { font-size: 1rem; line-height: 1.6; margin: 18px 0 6px; }
p.lead { color: var(--ink-soft); margin-bottom: 12px; }
.muted { color: var(--ink-soft); }
.small { font-size: .875rem; line-height: 1.6; }
.center { text-align: center; }

/* ---------- アプリバー ---------- */
.appbar {
  flex: none;
  display: flex; align-items: baseline; gap: 10px;
  background: var(--paper); border-bottom: 1px solid var(--line);
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
}
.appbar h1 { font-size: 1.0625rem; font-weight: 700; letter-spacing: .06em; white-space: nowrap; }
.appbar h1::before { content: ""; display: inline-block; width: 10px; height: 10px; background: var(--seal);
  border-radius: var(--r-mark); transform: rotate(45deg); margin-right: 9px; vertical-align: .02em; }
.appbar .sub { font-size: .875rem; color: var(--ink-soft); white-space: nowrap; }
@media (max-width: 480px) { .appbar .sub { display: none; } }
.appbar .lock { margin-left: auto; font-size: .875rem; color: var(--ink-soft);
  border: 1px solid var(--line); border-radius: var(--r-pill); padding: 1px 10px; white-space: nowrap; }
main { max-width: 640px; margin: 0 auto; padding: 16px 14px 40px; }

/* ---------- ボタン ---------- */
button {
  font: inherit; letter-spacing: .02em; line-height: 1.35; cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--card); color: var(--ink);
  border-radius: var(--r-btn); padding: 10px 14px; min-height: 44px;
  transition: transform .12s var(--ease-out), background-color .12s linear, border-color .12s linear;
}
button:active { transform: scale(.98); }
button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
button.primary { background: var(--seal); border-color: var(--seal); color: var(--seal-ink); font-weight: 700; }
button.big { width: 100%; padding: 13px 16px; }
button.ghost { background: transparent; }
button.chipbtn { border-radius: var(--r-pill); font-size: .875rem; padding: 9px 14px; }
button.chipbtn.on { background: var(--seal); border-color: var(--seal); color: var(--seal-ink); }
button.dangerbtn { background: var(--magnet); border-color: var(--magnet); color: #fff; font-weight: 700; }
@media (hover: hover) and (pointer: fine) {
  button.primary:hover { background: var(--seal-deep); border-color: var(--seal-deep); }
  button:not(.primary):not(.dangerbtn):hover { border-color: var(--ink-soft); }
}
.btnrow { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.btnrow button { flex: 1 1 auto; }

/* ---------- フォーム ---------- */
textarea, input[type=text], input[type=date], input[type=number], select {
  font: inherit; letter-spacing: .02em; width: 100%;
  border: 1px solid var(--line-strong); border-radius: var(--r-btn);
  background: var(--card); color: var(--ink); padding: 10px 12px;
}
textarea { min-height: 72px; resize: vertical; }
label.fld { display: block; margin: 18px 0 6px; font-size: .875rem; line-height: 1.6; color: var(--ink-soft); }

/* ---------- タグ・バッジ ---------- */
.tag { display: inline-block; background: var(--chip); border-radius: var(--r-pill); padding: 1px 10px;
  font-size: .875rem; line-height: 1.6; margin: 0 4px 4px 0; color: var(--ink-soft); }
/* 定石の根拠4段階は、盤面の3色（朱・緑・墨）と「ベタか輪郭か」の形で示す。
   色を足さずに4つを区別する＝コンセプトの彩色制限を守りつつ、色だけに頼らない（§5⑤） */
.badge { display: inline-block; border-radius: var(--r-chip); padding: 0 8px; font-size: .875rem; line-height: 1.5;
  font-weight: 700; vertical-align: middle; border: 1px solid transparent; }
.badge.guideline { background: var(--magnet); border-color: var(--magnet); color: var(--seal-ink); }
.badge.coach-consensus { background: var(--seal); border-color: var(--seal); color: var(--seal-ink); }
.badge.research-based { background: transparent; border-color: var(--seal); color: var(--seal); }
.badge.experimental { background: transparent; border-color: var(--line-strong); color: var(--ink-soft); }
.lvchip { font-size: .875rem; line-height: 1.5; color: var(--ink-soft);
  border: 1px solid var(--line); border-radius: var(--r-pill); padding: 0 9px; }

/* ---------- カード（面のみ・線と影で囲まない） ---------- */
.card { background: var(--card); border-radius: var(--r-card); padding: 16px 16px 18px; margin-bottom: 16px; }
.card.plain { background: transparent; padding: 0; }

/* ---------- 盤面（主役・作戦盤そのもの） ---------- */
.board { background: var(--board); color: var(--board-ink); border-radius: var(--r-card); padding: 14px 16px 16px; margin: 12px 0; }
.scoreline { display: flex; align-items: baseline; justify-content: center; gap: 14px; font-variant-numeric: tabular-nums; }
.scoreline .team { font-size: .875rem; color: var(--board-soft); }
.scoreline .num { font-size: 2.75rem; line-height: 1.15; font-weight: 700; letter-spacing: 0; }
.stateline { text-align: center; font-size: 1rem; margin-top: 2px; font-weight: 700; font-variant-numeric: tabular-nums; }
.boardrow { display: flex; align-items: center; justify-content: center; gap: 24px; margin-top: 10px; }
.diamond { position: relative; width: 84px; height: 66px; flex: none; }
.diamond .base { position: absolute; width: 22px; height: 22px; transform: rotate(45deg);
  background: transparent; border: 2px solid var(--board-line); border-radius: 3px; }
.diamond .b2 { top: 0; left: 31px; }
.diamond .b3 { top: 30px; left: 2px; }
.diamond .b1 { top: 30px; left: 60px; }
.diamond .base.on { background: var(--base-on); border-color: var(--base-on); }
.outsbox { text-align: center; font-size: .875rem; color: var(--board-soft); }
.outsbox .dots { display: flex; gap: 6px; justify-content: center; margin-top: 3px; }
.outsbox .dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--board-line); }
.outsbox .dot.on { background: var(--base-on); border-color: var(--base-on); }
.countbox { text-align: center; font-size: .875rem; color: var(--board-soft); font-variant-numeric: tabular-nums; }
.countbox b { font-size: 1.25rem; color: var(--board-ink); }
.extras { margin: 10px 4px 0; padding-left: 1.2em; font-size: .875rem; line-height: 1.6; color: var(--ink-soft); }
.narrative { margin: 12px 2px; }

/* ---------- 選択肢（かちり、と選ぶ） ---------- */
.opt { display: block; width: 100%; text-align: left; margin-bottom: 10px; padding: 12px 14px;
  border-radius: var(--r-btn); border: 1px solid var(--line-strong); background: var(--card); }
.opt .olabel { font-weight: 700; display: flex; align-items: baseline; gap: 10px; }
.opt .olabel::before { content: ""; flex: none; width: 9px; height: 9px;
  transform: rotate(45deg); border: 1.5px solid var(--line-strong); border-radius: var(--r-mark); }
.opt.sel { border-color: var(--seal); box-shadow: inset 0 0 0 1px var(--seal); }
.opt.sel .olabel::before { background: var(--seal); border-color: var(--seal); }
.conf { display: flex; gap: 8px; margin-top: 6px; }
.conf button { flex: 1; font-size: .875rem; padding: 11px 4px; }
.conf button.on { background: var(--seal); color: var(--seal-ink); border-color: var(--seal); font-weight: 700; }
.stepper { display: flex; align-items: center; gap: 8px; margin: 2px 2px 12px; }
.stepper .dia { width: 10px; height: 10px; transform: rotate(45deg);
  border: 1.5px solid var(--line-strong); border-radius: var(--r-mark); background: transparent; }
.stepper .dia.done { background: var(--ink-soft); border-color: var(--ink-soft); }
.stepper .dia.now { background: var(--seal); border-color: var(--seal); }
.stepper .stext { font-size: .875rem; color: var(--ink-soft); margin-left: 4px; font-variant-numeric: tabular-nums; }

/* ---------- 検討室（見出し＋余白＋罫線で組む。箱は意味のあるものだけ） ---------- */
.safety { background: var(--safety-bg); border-radius: var(--r-card); padding: 12px 14px; margin-bottom: 12px; }
.safety .shead { font-weight: 700; font-size: .875rem; color: var(--safety-ink); margin-bottom: 4px; }
.cols { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 14px; }
@media (min-width: 560px) { .cols { grid-template-columns: 1fr 1fr; } }
.col .chead { font-size: .875rem; font-weight: 700; color: var(--ink-soft);
  padding-bottom: 5px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.col ul, .optreview ul { padding-left: 1.15em; }
.col li { margin-bottom: 7px; }
.col.camp { background: var(--chip); border-radius: var(--r-btn); padding: 11px 13px; }
.col.wakare { margin-top: 14px; }
.col.wakare > .chead { color: var(--magnet); }
.optreview { margin-top: 16px; }
.optreview .oitem { border-top: 1px solid var(--line); padding: 12px 2px; }
.optreview .oitem.chosen { background: var(--seal-soft); border-top-color: transparent; border-radius: var(--r-btn); padding: 12px 12px; }
.optreview .yours { color: var(--seal); font-size: .875rem; font-weight: 700; }
.optreview .aim { margin-top: 3px; }
.optreview .ura { color: var(--ink-soft); margin-top: 2px; }
.teigen { border-top: 1px solid var(--line); padding: 12px 2px 10px; }
.teigen .lnote { margin-top: 6px; font-size: .875rem; line-height: 1.6; color: var(--ink-soft); }
.banner { background: var(--chip); border-radius: var(--r-card); padding: 12px 14px; margin: 14px 0;
  font-size: .875rem; line-height: 1.6; color: var(--ink-soft); }
.actualbox { background: var(--seal-soft); border-radius: var(--r-card); padding: 14px 16px; margin: 14px 0; }
.actualbox .ahead { font-size: .875rem; font-weight: 700; color: var(--seal); margin-bottom: 4px; }
.sources { font-size: .875rem; line-height: 1.6; color: var(--ink-soft); margin-top: 8px; padding-left: 1.1em; }
.reasonbox { background: var(--chip); border-radius: var(--r-btn); padding: 10px 12px; margin: 12px 0; }
.refs { margin-top: 12px; }
.refs .tag { background: transparent; border: 1px solid var(--line); }

/* ---------- タブバー（文字タブ・現在地は上端の線＋色＋太字） ---------- */
.tabbar {
  flex: none;
  display: flex; background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar button { position: relative; flex: 1; border: none; border-radius: 0; background: none;
  min-height: 52px; padding: 8px 0; font-size: .875rem; color: var(--ink-soft); transition: none; }
.tabbar button:active { transform: none; }
.tabbar button.on { color: var(--seal); font-weight: 700; }
.tabbar button.on::before { content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 26px; height: 2px; background: var(--seal); }

/* ---------- モーダル（浮くものなので影を使う） ---------- */
.modalwrap { position: fixed; inset: 0; z-index: 50; background: rgba(18, 26, 20, .55);
  display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 560px) { .modalwrap { align-items: center; } }
.modal { background: var(--card); border-radius: var(--r-modal) var(--r-modal) 0 0; width: 100%; max-width: 560px;
  max-height: 86vh; overflow-y: auto; overscroll-behavior: contain;
  padding: 20px 18px 24px; box-shadow: var(--shadow-float); }
@media (min-width: 560px) { .modal { border-radius: var(--r-modal); } }
.modal h3 { margin-top: 2px; }

/* ---------- 画面内のお知らせ（window.alert の代替。浮くものなので影を使う） ---------- */
#notice-root { position: fixed; left: 0; right: 0; bottom: calc(62px + env(safe-area-inset-bottom));
  z-index: 60; display: flex; justify-content: center; pointer-events: none; padding: 0 12px; }
#notice-root .notice { pointer-events: auto; background: var(--ink); color: var(--paper);
  border-radius: var(--r-btn); padding: 12px 16px; line-height: 1.6; box-shadow: var(--shadow-float);
  max-width: 560px; animation: rise .16s var(--ease-out); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
#notice-root .nclose { margin-left: 10px; background: none; border: 1px solid currentColor; color: inherit;
  border-radius: var(--r-chip); padding: 2px 10px; font-size: .875rem; min-height: 0; }

/* ---------- 一覧・記録 ---------- */
.listitem { border-bottom: 1px solid var(--line); padding: 12px 2px; }
.listitem:last-child { border-bottom: none; }
/* 一覧から1件を選ぶ札（div+onclickでなくbuttonにしてキーボードでも辿れる） */
.pickcard { display: block; width: 100%; text-align: left; background: var(--card); border: none;
  border-radius: var(--r-card); padding: 13px 15px; margin-bottom: 10px; min-height: 0; }
.pickcard b { display: block; margin-top: 2px; }
/* 記録の1件（押すと振り返りが開く） */
.recitem { display: block; width: 100%; text-align: left; background: none; border: none;
  border-bottom: 1px solid var(--line); border-radius: 0; padding: 12px 2px; min-height: 0; }
.recitem:active { transform: none; }
/* 既定で畳んでおく区画（普段は見えなくていいもの） */
details.fold { border-top: 1px solid var(--line); }
details.fold > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px;
  padding: 14px 2px; font-weight: 700; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: ""; flex: none; width: 7px; height: 7px; margin-left: 2px;
  border-right: 1.5px solid var(--ink-soft); border-bottom: 1.5px solid var(--ink-soft);
  transform: rotate(-45deg); transition: transform .15s var(--ease-out); }
details.fold[open] > summary::before { transform: rotate(45deg) translate(-2px, -2px); }
details.fold > summary .cnt { margin-left: auto; font-weight: 400; color: var(--ink-soft);
  font-size: .875rem; font-variant-numeric: tabular-nums; }
details.fold .foldbody { padding: 0 0 18px; }
details.fold .foldbody h3:first-child { margin-top: 4px; }
.notecard { background: var(--card); border-radius: var(--r-card); padding: 13px 15px; margin-bottom: 10px; }
.notecard .ntext { font-weight: 700; white-space: pre-wrap; }
.notecard .nmeta { margin-top: 6px; font-size: .875rem; line-height: 1.6; color: var(--ink-soft); }
.covtable { width: 100%; border-collapse: collapse; font-size: .875rem; line-height: 1.35; font-variant-numeric: tabular-nums; }
.covtable th, .covtable td { border-bottom: 1px solid var(--line); padding: 11px 8px; text-align: left; }
.covtable td.n { text-align: right; }
.done { color: var(--seal); font-weight: 700; }
.flag { color: var(--magnet); border: 1px solid currentColor; border-radius: var(--r-pill); padding: 0 8px; font-size: .875rem; }
.timer { text-align: center; font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: .875rem; margin-bottom: 8px; }
.timer.over { color: var(--magnet); }
.homehero { text-align: center; padding: 10px 0 6px; }
.homehero .date { font-size: .875rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.reunion { background: var(--seal-soft); border-radius: var(--r-card); padding: 13px 15px; margin: 12px 0; }
.reunion .rhead { font-size: .875rem; font-weight: 700; color: var(--seal); margin-bottom: 4px; }
.warnbox { background: var(--magnet-soft); border-radius: var(--r-card); padding: 11px 14px; margin: 10px 0; }
.gamehead { font-size: .875rem; line-height: 1.6; color: var(--ink-soft);
  border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 10px; }
.gamehead b { color: var(--ink); font-size: 1rem; display: block; }
button.dangerbtn { background: var(--magnet); border-color: var(--magnet); }

/* ---------- 達成（土の色は、ここでしか出ない） ---------- */
/* 形＝署名の菱形を捕った本数ぶん／時間＝420msで灯り、900msかけて余韻に落ちる2段／
   面積＝18pxを間隔16pxで横に並べる。手本は Diamond の「金の光」（opacity 0→1→.32 の2段明滅） */
.setdone h2::before { background: var(--clay); width: 12px; height: 12px; }
.setdone h2 { margin-top: 4px; }
.tally { display: flex; justify-content: center; gap: 16px; margin: 2px 0 16px; }
.tally .dia { width: 18px; height: 18px; border-radius: 2px; background: var(--clay);
  transform: rotate(45deg); opacity: 0; animation: clay-light 1320ms forwards; }
@keyframes clay-light {
  0%   { opacity: 0; transform: rotate(45deg) scale(.4); animation-timing-function: cubic-bezier(.23, 1, .32, 1); }
  32%  { opacity: 1; transform: rotate(45deg) scale(1); animation-timing-function: linear; }
  39%  { opacity: 1; animation-timing-function: ease-in; }
  100% { opacity: .42; transform: rotate(45deg) scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  .tally .dia { animation: none; opacity: 1; }  /* 動かさずに、灯った状態で見せる */
}

@media print {
  .tabbar, .appbar, .noprint, button, #notice-root, #modal-root { display: none !important; }
  /* 画面は3段組みで内側だけスクロールするが、紙では全部を流す */
  body { display: block; height: auto; overflow: visible; background: #fff; color: #000; padding: 0; }
  #scroll { overflow: visible; }
  * { box-shadow: none !important; }
  .card, .notecard, .reunion { background: #fff; border: 1px solid #999; break-inside: avoid; }
  h2::before { display: none; }
  h2, h3 { break-after: avoid; }
  p { orphans: 3; widows: 3; }
  main { max-width: none; }
}
</style>

<body>
<header class="appbar">
  <h1>Tact</h1>
  <span class="sub">采配の千本ノック</span>
  <span class="lock">データは端末内のみ</span>
</header>
<div id="scroll"><main id="view"></main></div>
<nav class="tabbar" id="tabbar"></nav>
<div id="modal-root"></div>
<div id="notice-root"></div>
<script src="decks/starter.deck.js"></script>
<script src="decks/meikyusen.deck.js"></script>
<script>
"use strict";
/* =========================================================================
   Tact（タクト） — 采配トレーニング。AI不使用・オフライン完結の単一アプリ
   仕様書: ../Tact 開発指示書.md（本実装はAI機能を持たない静的デッキ版。旧名: 采配ノック）
   設計上の約束:
     - 検討室は決断の提出後にしか描画されない（②の前に④は開かない — 順序はコードで強制）
     - 「正解/不正解」を宣言するUI・語彙は存在しない（無裁定原則）
     - データはすべて localStorage（端末内のみ）。エクスポートでバックアップ可能
   ========================================================================= */

/* ---------- 基盤 ---------- */
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fmtDate = (ts) => { const d = new Date(ts); return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate(); };
const DAY = 86400000;

// 旧名「采配ノック」時代の saihai.* キーからの一回きり移行（キー単位・元データは消さない）
(function migrateFromSaihai() {
  const KEYS = ["settings", "reps", "notes", "mochikaeri", "fieldlog", "pendingSet"];
  for (const k of KEYS) {
    try {
      if (localStorage.getItem("tact." + k) === null) {
        const old = localStorage.getItem("saihai." + k);
        if (old !== null) localStorage.setItem("tact." + k, old);
      }
    } catch (e) { /* 意図的に無視: 移行失敗でも旧キーは無傷のまま残り、新規状態で起動できる */ }
  }
})();

const store = {
  get(key, fallback) { try { const v = localStorage.getItem("tact." + key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } },
  set(key, val) {
    try { localStorage.setItem("tact." + key, JSON.stringify(val)); }
    catch (e) {
      // 容量超過などで保存に失敗しても、入力を画面に残したまま知らせる（黙って失うのが最悪）
      if (typeof notice === "function") notice("保存できませんでした（" + e.name + "）。設定画面から書き出しでバックアップを取り、不要なデータを整理してください。", true);
    }
  },
  del(key) { localStorage.removeItem("tact." + key); },
};

const DEFAULT_SETTINGS = { resolutionMax: 1, tempo: false, renmei: "", kyusuMemo: "", denreiMemo: "", kimegoto: "" };
let settings = Object.assign({}, DEFAULT_SETTINGS, store.get("settings", {}));
const saveSettings = () => store.set("settings", settings);

const getReps = () => store.get("reps", []);
const saveReps = (r) => store.set("reps", r);
const getNotes = () => store.get("notes", []);
const saveNotes = (n) => store.set("notes", n);
const getMochi = () => store.get("mochikaeri", []);
const saveMochi = (m) => store.set("mochikaeri", m);
const getFieldlog = () => store.get("fieldlog", []);
const saveFieldlog = (f) => store.set("fieldlog", f);

const DECKS = window.TACT_DECKS || {};
const STARTER = DECKS.starter || [];
const MEIKYUSEN = DECKS.meikyusen || [];
const cardById = (id) => STARTER.find((c) => c.id === id) || MEIKYUSEN.find((c) => c.id === id) || null;

const TAGS = ["終盤僅差・攻撃", "序盤の先制機", "送りバントの是非", "盗塁・エンドラン", "スクイズ判断", "代打・代走", "ビハインドの反撃",
  "終盤僅差・守備（前進守備）", "継投・球数", "敬遠・勝負", "ピンチの伝令", "守備位置・シフト",
  "初回の入り", "ビッグイニング阻止", "流れが悪い時の一手", "大会形式・消耗管理",
  "打者への指示", "走塁・本塁突入", "少人数の現実", "タイブレーク"];
const EVIDENCE_LABEL = { "guideline": "公的ガイドライン", "research-based": "データの裏付け（外挿注意）", "coach-consensus": "広く行われる定石", "experimental": "試す価値（確度低）" };
const CONF_LABEL = { 1: "迷った", 2: "まあ決めた", 3: "迷いなし" };
const BANNER_TEXT = "結果は正解の証明ではない — 名勝負として残った采配は、成功したから残った（生存バイアス）。良い判断でも裏目は出るし、その逆もある。";

/* ---------- 画面状態 ---------- */
let screen = { name: "home" };
let knock = null; // { mode, ids, idx, phase, chosen, free, reason, conf, fuChosen, fuReason, repId, reunionDone, mochiId }
let timerHandle = null;

/* スクロールするのは body でなく内側の器（#scroll）。先頭に戻すのはこちら */
function toTop() { const s = $("#scroll"); if (s) s.scrollTop = 0; }
function go(next) { screen = next; render(); toTop(); }

/* ---------- 盤面描画 ---------- */
function boardHtml(board, rules) {
  if (!board) return "";
  const innings = (rules && rules.innings) || 9;
  const r = board.runners || [];
  const on = (b) => (r.includes(b) ? " on" : "");
  const outsDots = [0, 1, 2].map((i) => `<span class="dot${i < board.outs ? " on" : ""}"></span>`).join("");
  const batter = board.batterOrder ? `打者 ${board.batterOrder}番` : "";
  const count = board.count ? `<div class="countbox">カウント<br><b>${board.count.b}-${board.count.s}</b></div>` : "";
  const extras = (board.extras && board.extras.length) ? `<ul class="extras">${board.extras.map((e) => `<li>${esc(e)}</li>`).join("")}</ul>` : "";
  return `
  <div class="board">
    <div class="scoreline"><span class="team">うち</span><span class="num">${board.score.us}</span><span class="team">—</span><span class="num">${board.score.opp}</span><span class="team">相手</span></div>
    <div class="stateline">${board.inning}回${esc(board.topBottom)}（${innings}回制${rules && rules.extra ? "・延長" : ""}）　${batter ? esc(batter) : ""}</div>
    <div class="boardrow">
      <div class="outsbox">アウト<div class="dots">${outsDots}</div></div>
      <div class="diamond"><span class="base b2${on("二塁")}"></span><span class="base b3${on("三塁")}"></span><span class="base b1${on("一塁")}"></span></div>
      ${count || `<div class="countbox" style="visibility:hidden">カウント<br><b>0-0</b></div>`}
    </div>
    ${extras}
  </div>`;
}

/* ---------- セット構築（タグカバレッジ・再ノック待ち行列を考慮 / 決定的ロジック＋少しの乱数） ---------- */
function buildDailySet() {
  const reps = getReps();
  const now = Date.now();
  const lastServed = {}; const tagLast = {};
  for (const r of reps) {
    lastServed[r.cardId] = Math.max(lastServed[r.cardId] || 0, r.ts);
    for (const t of r.tags || []) tagLast[t] = Math.max(tagLast[t] || 0, r.ts);
  }
  // 再ノック待ち: 自信度1 or「異議あり」のカードで、14日以上経過し、その後出題されていないもの
  const due = new Set();
  for (const r of reps) {
    if ((r.conf === 1 || r.flag) && now - r.ts > 14 * DAY && lastServed[r.cardId] === r.ts) due.add(r.cardId);
  }
  const pool = STARTER.filter((c) => c.resolution <= settings.resolutionMax);
  const scored = pool.map((c) => {
    let s = Math.random();
    const ls = lastServed[c.id];
    if (!ls) s += 3; else { s += Math.min((now - ls) / DAY / 10, 2); if (now - ls < 10 * DAY) s -= 5; }
    let tagBonus = 0;
    for (const t of c.phaseTags) if (!tagLast[t] || now - tagLast[t] > 28 * DAY) tagBonus += 1.5;
    s += Math.min(tagBonus, 3);
    if (due.has(c.id)) s += 4;
    return { c, s };
  }).sort((a, b) => b.s - a.s);
  const picked = []; const usedTags = new Set();
  for (const { c } of scored) {
    if (picked.length >= 3) break;
    const primary = c.phaseTags[0];
    if (usedTags.has(primary) && scored.length - picked.length > 3) continue;
    picked.push(c.id); usedTags.add(primary);
  }
  for (const { c } of scored) { if (picked.length >= 3) break; if (!picked.includes(c.id)) picked.push(c.id); }
  return picked;
}

/* ---------- ノック開始 ---------- */
function startDaily() {
  const pending = store.get("pendingSet", null);
  let ids, idx;
  if (pending && pending.ids && pending.idx > 0 && pending.idx < pending.ids.length) { ids = pending.ids; idx = pending.idx; }
  else { ids = buildDailySet(); idx = 0; }
  if (!ids.length) { notice("出題できるカードがありません。設定で解像度を確認してください。", true); return; }
  store.set("pendingSet", { ids, idx });
  knock = { mode: "daily", ids, idx, phase: "reunion", chosen: null, free: "", reason: "", conf: 0, fuChosen: null, fuReason: "", repId: null, timerEnd: null };
  if (!getNotes().length || idx > 0) knock.phase = "present";
  go({ name: "knock" });
}
function startMeikyusen(id) {
  knock = { mode: "meikyusen", ids: [id], idx: 0, phase: "present", chosen: null, free: "", reason: "", conf: 0, fuChosen: null, fuReason: "", repId: null };
  go({ name: "knock" });
}
/* 一覧から1枚だけ捕る（タイブレークなど。終えたら来た一覧へ戻る） */
function startSingle(id, back) {
  knock = { mode: "single", ids: [id], idx: 0, phase: "present", chosen: null, free: "", reason: "", conf: 0, fuChosen: null, fuReason: "", repId: null, timerEnd: null, back: back || "home" };
  go({ name: "knock" });
}
/* 記録から過去の1本を開き直す（読むだけ。新しい記録は作らない） */
function openReview(repId) {
  const rep = getRep(repId);
  const card = rep && rep.cardId ? cardById(rep.cardId) : null;
  if (!card) { notice("この場面のカードが見つかりません（持ち帰りの記録か、デッキから外れた可能性があります）", true); return; }
  knock = { mode: "review", ids: [card.id], idx: 0, phase: "discuss", chosen: null, free: "", reason: "", conf: 0, fuChosen: null, fuReason: "", repId: rep.id, back: "records" };
  go({ name: "knock" });
}
/* 同じ場面を、今の自分でもう一度決める（新しい1本として記録される） */
function startAgain(cardId) {
  if (!cardById(cardId)) return;
  knock = { mode: "again", ids: [cardId], idx: 0, phase: "present", chosen: null, free: "", reason: "", conf: 0, fuChosen: null, fuReason: "", repId: null, timerEnd: null, back: "records" };
  go({ name: "knock" });
}
function startReplay(mochiId) {
  knock = { mode: "replay", ids: [], idx: 0, phase: "present", chosen: null, free: "", reason: "", conf: 0, repId: null, mochiId };
  go({ name: "knock" });
}

/* ---------- 決断の提出（ここで初めて記録され、検討室が開く） ---------- */
function currentCard() { return knock ? cardById(knock.ids[knock.idx]) : null; }

function submitDecision() {
  const card = currentCard();
  if (!card || knock.phase !== "present") return;
  const choice = knock.chosen != null ? card.options[knock.chosen].label : (knock.free.trim() || null);
  if (!choice || knock.reason.trim().length < 2 || !knock.conf) return;
  const reps = getReps();
  const rep = {
    id: uid(), ts: Date.now(), cardId: card.id, deck: card.source, title: card.title,
    tags: card.phaseTags, choice, free: knock.chosen == null, reason: knock.reason.trim(),
    conf: knock.conf, flag: false, followup: null, ruleIds: [],
  };
  reps.push(rep); saveReps(reps); knock.repId = rep.id;
  markDailyConsumed(); // 決断を出した時点で消化済み。タブバーで離脱しても「続きから」が同じカードを返さない
  const fu = (card.followups || []).find((f) => f.when.includes(choice));
  knock.phase = fu ? "followup" : "discuss";
  render(); toTop();
}
function submitFollowup() {
  const card = currentCard();
  const fu = (card.followups || []).find((f) => f.when.includes(getRep(knock.repId).choice));
  if (!fu || knock.fuChosen == null) return;
  const reps = getReps(); const rep = reps.find((r) => r.id === knock.repId);
  rep.followup = { choice: fu.options[knock.fuChosen].label, reason: knock.fuReason.trim() };
  saveReps(reps);
  knock.phase = "discuss";
  render(); toTop();
}
function getRep(id) { return getReps().find((r) => r.id === id) || {}; }
function toggleFlag() {
  const reps = getReps(); const rep = reps.find((r) => r.id === knock.repId);
  if (!rep) return; rep.flag = !rep.flag; saveReps(reps); render();
}
function hasNextDaily() { return !!knock && knock.mode === "daily" && knock.idx + 1 < knock.ids.length; }
/* 今日のセットの進捗を「このカードは終わった」状態にする（何度呼んでも同じ） */
function markDailyConsumed() {
  if (!knock || knock.mode !== "daily") return;
  const nextIdx = knock.idx + 1;
  if (nextIdx < knock.ids.length) store.set("pendingSet", { ids: knock.ids, idx: nextIdx });
  else store.del("pendingSet");
}
/* 検討室の「今日はここまで」— 途中で気持ちよく終われるように */
function pauseSet() {
  markDailyConsumed();
  knock = null;
  go({ name: "home" });
  notice("ここまでを保存しました。続きはホームの「続きから」で。");
}
function finishCard() {
  if (knock.mode === "daily") {
    const nextIdx = knock.idx + 1;
    markDailyConsumed();
    if (nextIdx < knock.ids.length) {
      knock = Object.assign(knock, { idx: nextIdx, phase: "present", chosen: null, free: "", reason: "", conf: 0, fuChosen: null, fuReason: "", repId: null, timerEnd: null });
      render(); toTop();
    } else {
      knock.phase = "setdone"; render(); toTop();
    }
  } else {
    const back = knock.back || "home";
    knock = null; go({ name: back });
  }
}

/* ---------- ルール蒸留（AI下書きなし・本人の言葉で） ---------- */
function openRuleModal(presetTags, sourceIds, afterSave) {
  const tpl = "【いつ】\n【どうする】\n【なぜ】";
  showModal(`
    <h3>采配ノートにルールを書く</h3>
    <p class="muted small">この一本から残したい「if-then」を、自分の言葉で。あとから編集できます。</p>
    <textarea id="ruletext" rows="5" placeholder="例: 三塁に走者を置いたら、サインを出す前に「外された時どうするか」まで決めておく">${esc(tpl)}</textarea>
    <label class="fld">タグ（この局面のタグが入っています）</label>
    <div>${presetTags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    <p id="rulewarn" class="small" style="display:none;color:var(--danger);margin-top:8px"></p>
    <div class="btnrow">
      <button class="ghost" onclick="closeModal()">やめる</button>
      <button class="primary" id="rulesave">ノートに残す</button>
    </div>
  `);
  $("#rulesave").onclick = () => {
    const text = $("#ruletext").value.trim();
    if (text.length < 8 || text === "【いつ】\n【どうする】\n【なぜ】") { const w = $("#rulewarn"); w.textContent = "自分の言葉で書けてから保存しましょう（テンプレのままは保存できません）"; w.style.display = "block"; return; }
    const notes = getNotes();
    const note = { id: uid(), ts: Date.now(), text, tags: presetTags, sources: sourceIds };
    notes.push(note); saveNotes(notes);
    if (knock && knock.repId) { const reps = getReps(); const rep = reps.find((r) => r.id === knock.repId); if (rep) { rep.ruleIds.push(note.id); saveReps(reps); } }
    closeModal(); if (afterSave) afterSave(); render();
  };
}

/* ---------- モーダル ---------- */
function showModal(html) { $("#modal-root").innerHTML = `<div class="modalwrap" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal() { $("#modal-root").innerHTML = ""; }

/* ---------- 画面内の確認・お知らせ（window.confirm / alert は端末により黙って無視されるため使わない） ---------- */
let confirmAction = null;
function askConfirm(opts) {
  confirmAction = opts.onOk;
  showModal(`
    <h3>${esc(opts.title)}</h3>
    ${opts.body ? `<p class="small" style="white-space:pre-wrap">${esc(opts.body)}</p>` : ""}
    ${opts.items && opts.items.length ? `<ul class="small">${opts.items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}
    <div class="btnrow">
      <button class="ghost" onclick="confirmAction=null;closeModal()">やめる</button>
      <button class="${opts.danger ? "dangerbtn" : "primary"}" onclick="runConfirmAction()">${esc(opts.okLabel || "実行する")}</button>
    </div>`);
}
function runConfirmAction() { const fn = confirmAction; confirmAction = null; closeModal(); if (fn) fn(); }
function notice(msg, sticky) {
  const root = $("#notice-root");
  root.innerHTML = `<div class="notice" role="status">${esc(msg)}${sticky ? ` <button class="nclose" onclick="this.closest('.notice').remove()">閉じる</button>` : ""}</div>`;
  clearTimeout(notice._t);
  if (!sticky) notice._t = setTimeout(() => { root.innerHTML = ""; }, 4000);
}

/* ---------- ノック画面 ---------- */
function renderKnock() {
  if (knock.mode === "replay") return renderReplay();
  const card = currentCard();
  if (!card) { knock = null; return renderHome(); }
  const isMei = card.source === "meikyusen"; // 振り返りで名勝負を開いても「実際の采配」が出るように
  const step = knock.mode === "daily"
    ? `<div class="stepper">${knock.ids.map((_, i) => `<span class="dia${i < knock.idx ? " done" : i === knock.idx ? " now" : ""}"></span>`).join("")}<span class="stext">${knock.idx + 1}本目 / 全${knock.ids.length}本</span></div>`
    : "";
  const tags = card.phaseTags.map((t) => `<span class="tag">${esc(t)}</span>`).join("") + ` <span class="lvchip">解像度 Lv${card.resolution}</span>`;
  const gamehead = isMei ? `<div class="gamehead"><b>${esc(card.game.name)}</b>${esc(card.game.date)}・${esc(card.game.place)}／視点: ${esc(card.game.viewpoint)}</div>` : "";

  if (knock.phase === "reunion") {
    const notes = getNotes(); const last = notes[notes.length - 1];
    return `
      <div class="reunion"><div class="rhead">前回のルールと再会</div>
        <div style="white-space:pre-wrap">${esc(last.text)}</div>
        <div class="muted small" style="margin-top:6px">${last.tags.map(esc).join(" / ")}　${fmtDate(last.ts)}</div>
      </div>
      <p class="muted small">復習であって宿題ではありません。眺めたら、今日の1本目へ。</p>
      <button class="primary big" onclick="knock.phase='present';render()">今日のノックを始める</button>`;
  }

  if (knock.phase === "present") {
    const canSubmit = (knock.chosen != null || knock.free.trim().length >= 2) && knock.reason.trim().length >= 2 && knock.conf;
    const timer = settings.tempo ? `<div class="timer" id="timer">30</div>` : "";
    return `
      ${step}
      <div class="card">
        ${gamehead}
        <div>${tags}</div>
        <h2>${esc(card.title)}</h2>
        ${boardHtml(card.board, card.rules)}
        <p class="narrative">${esc(card.narrative)}</p>
        ${timer}
        <h3>あなたの決断は？</h3>
        ${card.options.map((o, i) => `<button class="opt${knock.chosen === i ? " sel" : ""}" onclick="knock.chosen=${i};knock.free='';render()"><span class="olabel">${esc(o.label)}</span></button>`).join("")}
        <label class="fld">または自由記述（上の選択肢の代わりに）</label>
        <input type="text" id="freein" value="${esc(knock.free)}" placeholder="自分ならこうする…" oninput="freeInput(this)">
        <label class="fld">理由を一行（必須 — 言語化こそ稽古）</label>
        <textarea id="reasonin" rows="2" placeholder="なぜその手か。一行でいい" oninput="knock.reason=this.value;refreshSubmit()">${esc(knock.reason)}</textarea>
        <label class="fld">自信度</label>
        <div class="conf">
          ${[1, 2, 3].map((n) => `<button class="${knock.conf === n ? "on" : ""}" onclick="knock.conf=${n};render()">${n}・${CONF_LABEL[n]}</button>`).join("")}
        </div>
        <div class="btnrow"><button class="primary big" id="submitbtn" ${canSubmit ? "" : "disabled"} onclick="submitDecision()">この手でいく（検討室が開く）</button></div>
        <p class="muted small center">検討室は決断を出すまで開きません。</p>
      </div>`;
  }

  if (knock.phase === "followup") {
    const rep = getRep(knock.repId);
    const fu = (card.followups || []).find((f) => f.when.includes(rep.choice));
    const can = knock.fuChosen != null;
    return `
      ${step}
      <div class="card">
        <div class="muted small">あなたの決断: <b>${esc(rep.choice)}</b> → その手が、こう転がった。</div>
        <h2>二の手 — 裏目からの一手</h2>
        <p class="narrative">${esc(fu.narrative)}</p>
        ${boardHtml(fu.board, card.rules)}
        <h3>もう一手だけ、決める</h3>
        ${fu.options.map((o, i) => `<button class="opt${knock.fuChosen === i ? " sel" : ""}" onclick="knock.fuChosen=${i};render()"><span class="olabel">${esc(o.label)}</span></button>`).join("")}
        <label class="fld">理由（任意・一言）</label>
        <input type="text" value="${esc(knock.fuReason)}" oninput="knock.fuReason=this.value">
        <div class="btnrow"><button class="primary big" ${can ? "" : "disabled"} onclick="submitFollowup()">この手でいく</button></div>
      </div>`;
  }

  if (knock.phase === "discuss") return renderDiscussion(card, isMei, step, gamehead);

  if (knock.phase === "setdone") {
    const reps = getReps().slice(-3);
    return `
      <div class="card center setdone">
        <div class="tally">${knock.ids.map((_, i) => `<span class="dia" style="animation-delay:${i * 140}ms"></span>`).join("")}</div>
        <h2>今日の3本、捕りました</h2>
        <p class="muted small">ノックの本数は誇るための数字ではありません。残ったルールと、次の試合の現場ログだけが本物の成果です。</p>
      </div>
      ${reps.map((r) => `<div class="listitem"><b>${esc(r.title)}</b><br><span class="muted small">→ ${esc(r.choice)}（自信度${r.conf}${r.flag ? "・異議あり" : ""}）</span></div>`).join("")}
      <div class="btnrow">
        <button class="big" onclick="go({name:'notes'})">ノートを見る</button>
        <button class="primary big" onclick="knock=null;go({name:'home'})">ホームへ</button>
      </div>
      <p class="muted small center" style="margin-top:10px">慣れてきたら、設定で「解像度」を上げると同じ盤面でも景色が変わります。</p>`;
  }
  return "";
}

/* ---------- 検討室（decision 提出後にのみ到達） ---------- */
function renderDiscussion(card, isMei, step, gamehead) {
  const rep = getRep(knock.repId);
  const isReview = knock.mode === "review";
  const d = card.discussion || {};
  const safety = d.safety ? `
    <div class="safety"><div class="shead">安全がからむ局面 <span class="badge guideline">guideline</span></div>
      ${esc(d.safety.text)}
      ${settings.kyusuMemo ? `<div class="muted small" style="margin-top:6px">うちの規定メモ: ${esc(settings.kyusuMemo)}</div>` : `<div class="muted small" style="margin-top:6px">（設定画面に、所属連盟の球数規定メモを書いておけます）</div>`}
    </div>` : "";
  const yourEcho = `<div class="reasonbox">あなたの決断: <b>${esc(rep.choice)}</b>（自信度${rep.conf}・${CONF_LABEL[rep.conf]}）<br>理由: ${esc(rep.reason)}${rep.followup ? `<br>二の手: <b>${esc(rep.followup.choice)}</b>${rep.followup.reason ? " — " + esc(rep.followup.reason) : ""}` : ""}</div>`;
  const wakare = card.divisive && d.camps && d.camps.length === 2 ? `
    <div class="col wakare">
      <div class="chead">監督でも分かれる論点 — どちらの側にも実績ある監督がいます</div>
      <div class="cols" style="margin-top:6px">
        ${d.camps.map((c) => `<div class="col camp"><b>${esc(c.stance)}</b><div style="margin-top:4px">${esc(c.gist)}</div></div>`).join("")}
      </div>
      <p class="muted small" style="margin:6px 0 0">どちらに立つかより、「自分はなぜそちらに立つか」を言えることがこのノックの捕り方です。</p>
    </div>` : "";
  const cols = `
    ${wakare}
    <div class="cols">
      <div class="col"><div class="chead">勝敗の列 — 判断を分ける要素</div><ul>${(d.points.win || []).map((p) => `<li>${esc(p)}</li>`).join("")}</ul></div>
      <div class="col"><div class="chead">育成の列 — 選手が育つ視点</div><ul>${(d.points.grow || []).map((p) => `<li>${esc(p)}</li>`).join("")}</ul></div>
    </div>`;
  const optreview = `
    <div class="optreview"><h3>各選択肢の狙いと裏目（選ばなかった手も含めて）</h3>
      ${card.options.map((o) => `
        <div class="oitem${o.label === rep.choice ? " chosen" : ""}">
          ${o.label === rep.choice ? '<span class="yours">あなたの選択</span><br>' : ""}
          <b>${esc(o.label)}</b>${o.noMove ? ' <span class="lvchip">動かない系</span>' : ""}
          <div class="aim">狙い: ${esc(o.aim)}</div>
          <div class="ura">裏目: ${esc(o.ura)}</div>
        </div>`).join("")}
      ${rep.free ? `<p class="muted small">自由記述の手（${esc(rep.choice)}）を選びました。上の選択肢の構造と見比べて、自分の手の「狙いと裏目」も言葉にしてみてください。</p>` : ""}
    </div>`;
  const fuPlayed = rep.followup && (card.followups || []).find((f) => f.when.includes(rep.choice));
  const fuReview = fuPlayed && fuPlayed.points ? `<div class="col" style="margin-top:10px"><div class="chead">二の手の視点</div><ul>${fuPlayed.points.map((p) => `<li>${esc(p)}</li>`).join("")}</ul></div>` : "";
  const teigens = (d.teigen || []).map((t) => `
    <div class="teigen">
      <span class="badge ${esc(t.evidence)}">${esc(t.evidence)}</span> <span class="muted small">${EVIDENCE_LABEL[t.evidence] || ""}</span>
      <div style="margin-top:4px">${esc(t.text)}</div>
      <div class="lnote">うちのレベルでは: ${esc(t.levelNote)}</div>
    </div>`).join("");
  const voice = d.voice ? `
    <div id="voicewrap">
      <button class="chipbtn" onclick="$('#voicebody').style.display='block';this.style.display='none'">その指示、選手にどう伝える？（例を見る）</button>
      <div id="voicebody" style="display:none" class="col" >${esc(d.voice)}</div>
    </div>` : "";
  const refs = d.refs && d.refs.length ? `<div class="refs muted small">リポジトリの関連ページ:${d.refs.map((r) => `<span class="tag">${esc(r)}</span>`).join("")}</div>` : "";

  const actual = isMei ? `
    <div class="actualbox"><div class="ahead">実際の采配とその後</div>
      <b>${esc(card.actual.decision)}</b>
      <p style="margin-top:6px">${esc(card.actual.result)}</p>
      ${card.actual.context ? `<p class="muted small" style="margin-top:6px">${esc(card.actual.context)}</p>` : ""}
      <ul class="sources">${card.actual.sources.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>
      <p class="muted small">事実関係は収録時（2026-07）に上記出典で確認したものです。</p>
    </div>
    <div class="banner">${esc(BANNER_TEXT)}</div>
    <div class="col"><div class="chead">比較の問い</div>${esc(card.compareQuestion)}</div>` : "";

  return `
    ${step}
    <div class="card">
      ${gamehead}
      <h2>${isReview ? "振り返り" : "検討室 — 採点はしません"}</h2>
      <p class="muted small">${isReview
        ? `${fmtDate(rep.ts)} に捕った1本を、もう一度開いています。あのときの決断はそのまま残ります。`
        : "開くのは、論点・各選択肢の構造・定石とその由来。決めたのはあなたで、これからも毎回そうです。"}</p>
      ${safety}
      ${yourEcho}
      ${actual}
      ${cols}
      ${fuReview}
      ${optreview}
      <h3>定石とその由来</h3>
      ${teigens}
      ${voice}
      ${refs}
      <div class="btnrow">
        <button class="${getRep(knock.repId).flag ? "chipbtn on" : "chipbtn"}" onclick="toggleFlag()">この検討室に異議あり</button>
      </div>
      <p class="muted small">「異議あり」は「この定石はうちに合わない・局面が不自然」の印。責める道具ではなく、デッキを育てる材料です（記録画面で見返せます）。</p>
      <div class="btnrow">
        <button class="big" onclick="openRuleModal(${esc(JSON.stringify(card.phaseTags)).replace(/"/g, "&quot;")}, ['${esc(card.id)}'])">ルールにする</button>
        ${isReview ? `<button class="big" onclick="startAgain('${esc(card.id)}')">この場面をもう一度決める</button>` : ""}
        <button class="primary big" id="nextbtn" onclick="finishCard()">${hasNextDaily() ? "次の1本へ" : (isReview ? "記録へ戻る" : "終える")}</button>
      </div>
      ${hasNextDaily() ? `
      <div class="btnrow"><button class="ghost big" onclick="pauseSet()">今日はここまで</button></div>
      <p class="muted small">ここまでの${knock.idx + 1}本は記録に残ります。続きはホームの「続きから」で、次の1本から始まります。</p>` : ""}
    </div>`;
}

/* ---------- 持ち帰りノックの再ノック ---------- */
function renderReplay() {
  const item = getMochi().find((m) => m.id === knock.mochiId);
  if (!item) { knock = null; return renderMochiList(); }
  if (knock.phase === "present") {
    const can = knock.free.trim().length >= 2 && knock.reason.trim().length >= 2 && knock.conf;
    return `
      <div class="card">
        <div class="muted small">持ち帰りノック — あの場面をもう一度。今度は時間をかけて。</div>
        <h2>${esc(item.date)} の試合から</h2>
        ${item.board ? boardHtml(item.board, { innings: item.board.innings || 9, extra: true }) : ""}
        <p class="narrative"><b>場面:</b> ${esc(item.scene)}</p>
        <p class="narrative"><b>あの日の自分の采配:</b> ${esc(item.myCall)}</p>
        <p class="narrative"><b>モヤモヤ:</b> ${esc(item.moyamoya)}</p>
        <h3>落ち着いて、もう一度決断する</h3>
        <label class="fld">今ならどうする？</label>
        <textarea rows="2" oninput="knock.free=this.value;refreshSubmit()">${esc(knock.free)}</textarea>
        <label class="fld">理由（必須）</label>
        <textarea rows="2" id="reasonin" oninput="knock.reason=this.value;refreshSubmit()">${esc(knock.reason)}</textarea>
        <label class="fld">自信度</label>
        <div class="conf">${[1, 2, 3].map((n) => `<button class="${knock.conf === n ? "on" : ""}" onclick="knock.conf=${n};render()">${n}・${CONF_LABEL[n]}</button>`).join("")}</div>
        <div class="btnrow"><button class="primary big" id="submitbtn" ${can ? "" : "disabled"} onclick="submitReplayDecision()">この手でいく（セルフ検討室へ）</button></div>
      </div>`;
  }
  if (knock.phase === "discuss") {
    const s = item.replay && item.replay.self || {};
    return `
      <div class="card">
        <h2>セルフ検討室</h2>
        <p class="muted small">AIは出てきません。自分への3つの問いに答えると、この場面は「教材」になります。</p>
        <div class="reasonbox">今回の決断: <b>${esc(item.replay.decision)}</b>（自信度${item.replay.conf}）<br>理由: ${esc(item.replay.reason)}</div>
        <label class="fld">① この判断を分ける要素はどれだった？（点差・アウト・走者の足・相手の癖…）</label>
        <textarea rows="2" id="self1">${esc(s.factors || "")}</textarea>
        <label class="fld">② 選んだ手が裏目に出たら、次の一手は？</label>
        <textarea rows="2" id="self2">${esc(s.ura || "")}</textarea>
        <label class="fld">③ 勝敗の列と育成の列、それぞれで見るとどう見える？</label>
        <textarea rows="2" id="self3">${esc(s.winGrow || "")}</textarea>
        <div class="btnrow">
          <button class="big" onclick="saveReplaySelf();openRuleModal(['持ち帰り'], ['${esc(item.id)}'])">ルールにする</button>
          <button class="primary big" onclick="saveReplaySelf();knock=null;go({name:'mochikaeri'})">保存して終える</button>
        </div>
      </div>`;
  }
  return "";
}
function submitReplayDecision() {
  const items = getMochi(); const item = items.find((m) => m.id === knock.mochiId);
  if (!item || knock.free.trim().length < 2 || knock.reason.trim().length < 2 || !knock.conf) return;
  item.replay = { decision: knock.free.trim(), reason: knock.reason.trim(), conf: knock.conf, self: (item.replay && item.replay.self) || {}, ts: Date.now() };
  saveMochi(items);
  const reps = getReps();
  const rep = { id: uid(), ts: Date.now(), cardId: item.id, deck: "mochikaeri", title: "持ち帰り: " + item.scene.slice(0, 24), tags: ["持ち帰り"], choice: item.replay.decision, free: true, reason: item.replay.reason, conf: knock.conf, flag: false, followup: null, ruleIds: [] };
  reps.push(rep); saveReps(reps); knock.repId = rep.id;
  knock.phase = "discuss"; render(); toTop();
}
function saveReplaySelf() {
  const items = getMochi(); const item = items.find((m) => m.id === knock.mochiId);
  if (!item || !item.replay) return;
  item.replay.self = { factors: $("#self1").value.trim(), ura: $("#self2").value.trim(), winGrow: $("#self3").value.trim() };
  saveMochi(items);
}

/* ---------- ホーム ---------- */
function renderHome() {
  const reps = getReps();
  const notes = getNotes();
  const pending = store.get("pendingSet", null);
  const resume = pending && pending.ids && pending.idx > 0 && pending.idx < pending.ids.length;
  const reunion = notes.length ? notes[notes.length - 1] : null;
  const empty = !reps.length;
  return `
    <div class="homehero">
      <div class="date">${todayStr()}　これまで ${reps.length} 本</div>
    </div>
    ${empty ? `<div class="card center"><h2>まず1本、捕ってみましょう</h2><p class="muted small">試合で困る場面をツールが打ち込みます。あなたは決めて、理由を一行。それだけです。<br>採点はありません — 決めるのは、いつもあなたです。</p></div>` : ""}
    ${resume ? `<button class="primary big" onclick="startDaily()">続きから（${pending.idx + 1}/${pending.ids.length}本目）</button>` : `<button class="primary big" onclick="startDaily()">今日のノック（3本・5〜10分）</button>`}
    <div class="btnrow">
      <button class="big" onclick="go({name:'meikyusenList'})">名勝負ノック</button>
      <button class="big" onclick="go({name:'tiebreakList'})">タイブレーク</button>
      <button class="big" onclick="go({name:'mochiForm'})">試合の場面を持ち帰る</button>
    </div>
    ${reunion && !empty ? `<div class="reunion"><div class="rhead">最近のルール</div><div style="white-space:pre-wrap">${esc(reunion.text)}</div><div class="muted small" style="margin-top:4px">${fmtDate(reunion.ts)}</div></div>` : ""}
    <p class="muted small">毎日でなくていい。使わない日があっていい設計です（連続記録は数えていません）。<br>試合が近いなら → <a href="#" onclick="go({name:'brief'});return false">試合前ブリーフ</a></p>`;
}

/* ---------- 名勝負一覧 ---------- */

  const played = new Set(getReps().filter((r) => r.deck === "meikyusen").map((r) => r.cardId));

    <h2>名勝負ノック</h2>

    <div class="banner">${esc(BANNER_TEXT)}</div>
    ${MEIKYUSEN.map((c) => `
      <button class="pickcard" onclick="startMeikyusen('${c.id}')">
        <span class="muted small">${esc(c.game.name)}${played.has(c.id) ? '　<span class="done">✓ 体験済み（もう一度でも）</span>' : ""}</span>
        <b>${esc(c.title)}</b>
        <span>${c.phaseTags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</span>
      </button>`).join("")}
    <button class="ghost big" onclick="go({name:'home'})">← ホームへ</button>`;
}

/* ---------- タイブレーク一覧（延長の場面だけを集めた棚） ---------- */
function renderTiebreakList() {
  const cards = STARTER.filter((c) => c.phaseTags.includes("タイブレーク"));
  const played = new Set(getReps().map((r) => r.cardId));
  return `
    <h2>タイブレーク</h2>
    <p class="lead">延長は無死一・二塁から、しかも表と裏で同じ形が来る。ここだけを集中して捕れる棚です。</p>
    ${cards.map((c) => `
      <button class="pickcard" onclick="startSingle('${c.id}','tiebreakList')">
        <span class="muted small">解像度 Lv${c.resolution}${played.has(c.id) ? '　<span class="done">✓ 捕った（もう一度でも）</span>' : ""}</span>
        <b>${esc(c.title)}</b>
        <span>${c.phaseTags.filter((t) => t !== "タイブレーク").map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</span>
      </button>`).join("")}
    <p class="muted small">今日のノックにも、この場面は混ざって出ます。</p>
    <button class="ghost big" onclick="go({name:'home'})">← ホームへ</button>`;
}

/* ---------- 采配ノート ---------- */
let noteFilter = null;
function renderNotes() {
  const notes = getNotes().slice().reverse();
  const tagsInUse = [...new Set(notes.flatMap((n) => n.tags))];
  const shown = noteFilter ? notes.filter((n) => n.tags.includes(noteFilter)) : notes;
  return `
    <h2>僕の采配ノート</h2>
    <p class="lead">ノックから蒸留した、自分の言葉のif-thenルール帳。試合前に見返す一枚に育てます。</p>
    ${notes.length ? `
      <div style="margin-bottom:10px">
        <button class="chipbtn ${noteFilter === null ? "on" : ""}" onclick="noteFilter=null;render()">すべて</button>
        ${tagsInUse.map((t) => `<button class="chipbtn ${noteFilter === t ? "on" : ""}" onclick="noteFilter='${esc(t)}';render()">${esc(t)}</button>`).join(" ")}
      </div>
      ${shown.map((n) => `
        <div class="notecard">
          <div class="ntext">${esc(n.text)}</div>
          <div class="nmeta">${n.tags.map(esc).join(" / ")}　出典: ${n.sources.map(esc).join(", ")}　${fmtDate(n.ts)}</div>
          <div class="btnrow noprint">
            <button class="chipbtn" onclick="editNote('${n.id}')">編集</button>
            <button class="chipbtn" onclick="deleteNote('${n.id}')">削除</button>
          </div>
        </div>`).join("")}
      <div class="btnrow noprint">
        <button class="big" onclick="go({name:'brief'})">試合前ブリーフを作る</button>
        <button class="big" onclick="exportNotesMd()">Markdownで書き出す</button>
      </div>
      <p class="muted small">タグで絞って見比べると、矛盾していそうなルールの組に自分で気づけます。統合するかどうかも、あなたが決めることです。</p>
    ` : `<div class="card center"><p class="muted">まだルールはありません。<br>ノックの検討室で「ルールにする」を押すと、ここに貯まっていきます。</p></div>`}`;
}
function editNote(id) {
  const notes = getNotes(); const n = notes.find((x) => x.id === id); if (!n) return;
  showModal(`
    <h3>ルールを編集</h3>
    <textarea id="ruletext" rows="5">${esc(n.text)}</textarea>
    <p id="rulewarn" class="small" style="display:none;color:var(--danger);margin-top:8px"></p>

function download(filename, text, type) {
  const blob = new Blob([text], { type: type || "text/plain;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}
function exportNotesMd() {
  const notes = getNotes(); if (!notes.length) return;
  const byTag = {};
  for (const n of notes) for (const t of n.tags) (byTag[t] = byTag[t] || []).push(n);
  let md = `# 僕の采配ノート（${todayStr()} 書き出し）\n\n> Tact（采配の千本ノック）で自分の言葉にした if-then ルール集。\n`;
  const donePut = new Set();
  for (const t of Object.keys(byTag)) {
    md += `\n## ${t}\n`;
    for (const n of byTag[t]) { md += `- ${n.text.replace(/\n/g, " ／ ")}${donePut.has(n.id) ? "（再掲）" : ""}  \n  <small>出典: ${n.sources.join(", ")}・${fmtDate(n.ts)}</small>\n`; donePut.add(n.id); }
  }
  download(`采配ノート-${todayStr()}.md`, md, "text/markdown;charset=utf-8");
}

/* 実名らしきパターンの検知（決定的・提案のみ / §7） */
function detectNames(text) {
  const hits = [];
  const push = (m) => { if (m && !/^(相手|うち|自分|同|他)/.test(m)) hits.push(m); };
  let m;
  const re1 = /[一-鿿々]{1,4}(?:くん|君|さん|ちゃん|先輩)/g;
  const re2 = /[ァ-ヶー]{2,8}(?:くん|君|さん|ちゃん)/g;
  const re3 = /[一-鿿]{2,7}(?:中学校|中学|高校|高等学校|学園|シニア|ボーイズ)/g;
  while ((m = re1.exec(text))) push(m[0]);
  while ((m = re2.exec(text))) push(m[0]);
  while ((m = re3.exec(text))) push(m[0]);
  return [...new Set(hits)];
}

  const scene = $("#mscene").value.trim(), call = $("#mcall").value.trim(), moya = $("#mmoya").value.trim();
  if (!scene || !call) { notice("①場面 と ②自分の采配 は必須です"); return; }

function renderRecords() {
  const reps = getReps();
  const now = Date.now();
  const cov = TAGS.map((t) => {
    const rs = reps.filter((r) => (r.tags || []).includes(t));
    const last = rs.length ? Math.max(...rs.map((r) => r.ts)) : null;
    const c28 = rs.filter((r) => now - r.ts < 28 * DAY).length;
    return { t, total: rs.length, c28, last };
  });
  const flagged = reps.filter((r) => r.flag);
  const logs = getFieldlog().slice().reverse();
  // ノックの記録は種類（局面タグ）ごとにまとめ、最近捕った種類を上に置く
  const groups = new Map();
  for (const r of reps) {
    const key = (r.tags && r.tags[0]) || "その他";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  const grouped = [...groups.entries()]
    .map(([tag, rs]) => ({ tag, rs: rs.slice().reverse(), last: Math.max(...rs.map((r) => r.ts)) }))
    .sort((a, b) => b.last - a.last);
  const repItem = (r) => `
    <button class="recitem" onclick="openReview('${r.id}')">
      <b>${esc(r.title)}</b> <span class="lvchip">${esc(r.deck)}</span><br>
      <span class="muted small">${fmtDate(r.ts)}　→ ${esc(r.choice)}（自信度${r.conf}）${r.flag ? ' <span class="flag">異議あり</span>' : ""}${r.ruleIds && r.ruleIds.length ? "　ルール化済み" : ""}</span>
    </button>`;
  return `
    <h2>現場ログ — このツールの成功指標</h2>
    <p class="lead">試合ごとに一行。「迷わず出せた指示」がここに増えていくかどうかだけが、ノックの成果の物差しです。</p>
    <div class="card">
      <label class="fld">試合日</label><input type="date" id="fldate" value="${todayStr()}">
      <label class="fld">迷わず出せた指示</label><input type="text" id="flok" placeholder="例: 8回の前進守備を迷わず宣言できた">
      <label class="fld">迷った場面</label><input type="text" id="flng" placeholder="例: 満塁策を出すか30秒固まった">
      <div class="btnrow"><button class="primary" onclick="addFieldlog()">記録する</button></div>
    </div>
    ${logs.map((l) => `<div class="listitem"><span class="muted small">${esc(l.date)}</span><br>${l.confident ? "○ " + esc(l.confident) + "<br>" : ""}${l.hesitated ? '<span class="muted">△ ' + esc(l.hesitated) + "</span>" : ""}</div>`).join("")}
    <details class="fold">
      <summary>ノックの記録<span class="cnt">${reps.length} 本</span></summary>
      <div class="foldbody">
        <p class="muted small">押すと、その場面の検討室をもう一度開けます（本数は目標ではありません）。</p>
        ${grouped.length ? grouped.map((g) => `
          <h3>${esc(g.tag)}<span class="muted small">　${g.rs.length}本</span></h3>
          ${g.rs.map(repItem).join("")}`).join("") : '<p class="muted small">まだありません。</p>'}
        ${flagged.length ? `
          <h3>異議ありの局面（デッキを育てる材料）</h3>
          <p class="muted small">次にシチュエーションを追加・改訂するとき（Claudeセッションで）に、この一覧を伝えてください。</p>
          ${flagged.map((r) => `<div class="listitem small">${esc(r.cardId)} — ${esc(r.title)}</div>`).join("")}` : ""}
      </div>
    </details>
    <details class="fold">
      <summary>局面タグのカバレッジ<span class="cnt">${cov.filter((c) => c.total > 0).length} / ${cov.length} 種</span></summary>
      <div class="foldbody">
        <p class="muted small">直近4週間で出ていないタグは、次のセットで優先的に出題されます。</p>
        <table class="covtable"><tr><th>タグ</th><th class="n">4週</th><th class="n">通算</th><th>最後に捕った日</th></tr>
          ${cov.map((c) => `<tr><td>${esc(c.t)}</td><td class="n">${c.c28}</td><td class="n">${c.total}</td><td>${c.last ? fmtDate(c.last) : "—"}</td></tr>`).join("")}
        </table>
      </div>
    </details>`;
}

function exportAll() {

function importAll(input) {
  const f = input.files && input.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const j = JSON.parse(reader.result);
      if ((j.app !== "tact" && j.app !== "saihai-knock") || !j.data) throw new Error("形式が違う");
      askConfirm({
        title: "バックアップを読み込みます", body: "現在の端末のデータを、このファイルの内容でまるごと置き換えます。", okLabel: "置き換える", danger: true,
        onOk: () => {
          settings = Object.assign({}, DEFAULT_SETTINGS, j.data.settings || {}); saveSettings();
          saveReps(j.data.reps || []); saveNotes(j.data.notes || []); saveMochi(j.data.mochikaeri || []); saveFieldlog(j.data.fieldlog || []);
          render(); notice("読み込みました");
        },
      });
    } catch (e) { notice("読み込めませんでした: " + e.message + "（端末のデータは元のままです）", true); }
  };
  reader.readAsText(f); input.value = "";
}
function resetAll() {
  askConfirm({
    title: "全データを消去します", body: "消すと戻せません。先に「すべて書き出す」でバックアップを。", okLabel: "すべて消す", danger: true,
    items: ["采配ノートのルール", "ノックの記録・現場ログ", "持ち帰り", "設定・うちの決め事"],
    onOk: () => {

      settings = Object.assign({}, DEFAULT_SETTINGS);
      go({ name: "home" }); notice("初期化しました");
    },
  });
}

  doLeave();
}
function refreshSubmit() {
  const b = $("#submitbtn"); if (!b || !knock) return;
  let ok = false;
  if (knock.mode === "replay") ok = knock.free.trim().length >= 2 && knock.reason.trim().length >= 2 && !!knock.conf;
  else ok = (knock.chosen != null || knock.free.trim().length >= 2) && knock.reason.trim().length >= 2 && !!knock.conf;
  b.disabled = !ok;
}
function freeInput(el) {
  knock.free = el.value;
  if (el.value) { knock.chosen = null; document.querySelectorAll(".opt.sel").forEach((b) => b.classList.remove("sel")); }
  refreshSubmit();
}
function startTimer() {
  if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
  const el = $("#timer"); if (!el) return;
  if (!knock.timerEnd) knock.timerEnd = Date.now() + 30000; // 再描画でリセットされない締切方式
  const tick = () => {
    if (!document.body.contains(el)) { clearInterval(timerHandle); timerHandle = null; return; }
    const left = Math.ceil((knock.timerEnd - Date.now()) / 1000);
    if (left <= 0) { el.textContent = "試合なら、もう間が空いた頃。それでも「決めてから」動こう。"; el.classList.add("over"); clearInterval(timerHandle); timerHandle = null; }
    else el.textContent = String(left);
  };
  tick();
  timerHandle = setInterval(tick, 500);
}
function render() {
  const v = $("#view");
  if (!STARTER.length) { v.innerHTML = `<div class="card"><b>デッキが読み込めていません。</b><p class="small muted">decks/starter.deck.js と decks/meikyusen.deck.js が index.html と同じフォルダ構成にあるか確認してください。</p></div>`; return; }
  switch (screen.name) {
    case "home": v.innerHTML = renderHome(); break;
    case "knock": v.innerHTML = renderKnock(); break;
    case "meikyusenList": v.innerHTML = renderMeikyusenList(); break;
    case "tiebreakList": v.innerHTML = renderTiebreakList(); break;
    case "notes": v.innerHTML = renderNotes(); break;
    case "brief": v.innerHTML = renderBrief(); break;
    case "mochikaeri": v.innerHTML = renderMochiList(); break;
    case "mochiForm": v.innerHTML = renderMochiForm(); break;
    case "records": v.innerHTML = renderRecords(); break;
    case "settings": v.innerHTML = renderSettings(); break;
    default: v.innerHTML = renderHome();
  }
  renderTabbar();
  if (screen.name === "knock" && knock && knock.phase === "present" && settings.tempo) startTimer();
}
render();
</script>
</body>
</html>
